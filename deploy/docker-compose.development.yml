include:
  - path: docker-compose.database.yml

services:
  recommendation-model-service:
    build:
      context: ../src/Recommendation.ModelService
      dockerfile: Dockerfile
    container_name: online-market-recommendation-model-service
    restart: unless-stopped
    environment:
      RECOMMENDATION_MODEL_API_KEY: ${RECOMMENDATION_MODEL_API_KEY:?RECOMMENDATION_MODEL_API_KEY is required}
      RECOMMENDATION_MODEL_ARTIFACT_DIRECTORY: /app/artifacts
      RECOMMENDATION_ALS_FACTORS: ${RECOMMENDATION_ALS_FACTORS:-32}
      RECOMMENDATION_ALS_REGULARIZATION: ${RECOMMENDATION_ALS_REGULARIZATION:-0.05}
      RECOMMENDATION_ALS_ITERATIONS: ${RECOMMENDATION_ALS_ITERATIONS:-20}
      RECOMMENDATION_ALS_ALPHA: ${RECOMMENDATION_ALS_ALPHA:-20}
      RECOMMENDATION_ALS_RANDOM_SEED: ${RECOMMENDATION_ALS_RANDOM_SEED:-42}
      RECOMMENDATION_ALS_DEFAULT_LIMIT: ${RECOMMENDATION_ALS_DEFAULT_LIMIT:-8}
      RECOMMENDATION_ALS_MAXIMUM_LIMIT: ${RECOMMENDATION_ALS_MAXIMUM_LIMIT:-50}
      RECOMMENDATION_ALS_MINIMUM_SUBJECTS: ${RECOMMENDATION_ALS_MINIMUM_SUBJECTS:-2}
      RECOMMENDATION_ALS_MINIMUM_PRODUCTS: ${RECOMMENDATION_ALS_MINIMUM_PRODUCTS:-2}
      RECOMMENDATION_ALS_MINIMUM_INTERACTIONS: ${RECOMMENDATION_ALS_MINIMUM_INTERACTIONS:-3}
    ports:
      - "8085:8000"
    volumes:
      - recommendation_model_artifacts:/app/artifacts

volumes:
  recommendation_model_artifacts:
