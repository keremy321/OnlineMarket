include:
  - path: docker-compose.database.yml

services:
  recommendation-model-service:
    build:
      context: ../src/Recommendation.ModelService
      dockerfile: Dockerfile
    container_name: online-market-recommendation-model-service
    restart: unless-stopped
    environment:
      RECOMMENDATION_MODEL_API_KEY: ${RECOMMENDATION_MODEL_API_KEY:?RECOMMENDATION_MODEL_API_KEY is required}
      RECOMMENDATION_MODEL_ARTIFACT_DIRECTORY: /app/artifacts
      RECOMMENDATION_ALS_FACTORS: ${RECOMMENDATION_ALS_FACTORS:-32}
      RECOMMENDATION_ALS_REGULARIZATION: ${RECOMMENDATION_ALS_REGULARIZATION:-0.05}
      RECOMMENDATION_ALS_ITERATIONS: ${RECOMMENDATION_ALS_ITERATIONS:-20}
      RECOMMENDATION_ALS_ALPHA: ${RECOMMENDATION_ALS_ALPHA:-20}
      RECOMMENDATION_ALS_RANDOM_SEED: ${RECOMMENDATION_ALS_RANDOM_SEED:-42}
      RECOMMENDATION_ALS_DEFAULT_LIMIT: ${RECOMMENDATION_ALS_DEFAULT_LIMIT:-8}
      RECOMMENDATION_ALS_MAXIMUM_LIMIT: ${RECOMMENDATION_ALS_MAXIMUM_LIMIT:-50}
      RECOMMENDATION_ALS_MINIMUM_SUBJECTS: ${RECOMMENDATION_ALS_MINIMUM_SUBJECTS:-2}
      RECOMMENDATION_ALS_MINIMUM_PRODUCTS: ${RECOMMENDATION_ALS_MINIMUM_PRODUCTS:-2}
      RECOMMENDATION_ALS_MINIMUM_INTERACTIONS: ${RECOMMENDATION_ALS_MINIMUM_INTERACTIONS:-3}
      RECOMMENDATION_HYBRID_PERSONALIZED_ALS_WEIGHT: ${RECOMMENDATION_HYBRID_PERSONALIZED_ALS_WEIGHT:-0.50}
      RECOMMENDATION_HYBRID_PERSONALIZED_CONTENT_WEIGHT: ${RECOMMENDATION_HYBRID_PERSONALIZED_CONTENT_WEIGHT:-0.20}
      RECOMMENDATION_HYBRID_PERSONALIZED_ASSOCIATION_WEIGHT: ${RECOMMENDATION_HYBRID_PERSONALIZED_ASSOCIATION_WEIGHT:-0.15}
      RECOMMENDATION_HYBRID_PERSONALIZED_POPULARITY_WEIGHT: ${RECOMMENDATION_HYBRID_PERSONALIZED_POPULARITY_WEIGHT:-0.15}
      RECOMMENDATION_HYBRID_SIMILAR_CONTENT_WEIGHT: ${RECOMMENDATION_HYBRID_SIMILAR_CONTENT_WEIGHT:-0.70}
      RECOMMENDATION_HYBRID_SIMILAR_ASSOCIATION_WEIGHT: ${RECOMMENDATION_HYBRID_SIMILAR_ASSOCIATION_WEIGHT:-0.20}
      RECOMMENDATION_HYBRID_SIMILAR_POPULARITY_WEIGHT: ${RECOMMENDATION_HYBRID_SIMILAR_POPULARITY_WEIGHT:-0.10}
      RECOMMENDATION_HYBRID_CANDIDATE_POOL_MULTIPLIER: ${RECOMMENDATION_HYBRID_CANDIDATE_POOL_MULTIPLIER:-10}
      RECOMMENDATION_HYBRID_CANDIDATE_POOL_CAP: ${RECOMMENDATION_HYBRID_CANDIDATE_POOL_CAP:-500}
      RECOMMENDATION_EVALUATION_K: ${RECOMMENDATION_EVALUATION_K:-5}
      RECOMMENDATION_EVALUATION_MINIMUM_HISTORICAL_ORDERS: ${RECOMMENDATION_EVALUATION_MINIMUM_HISTORICAL_ORDERS:-2}
      RECOMMENDATION_EVALUATION_HOLDOUT_ORDER_COUNT: ${RECOMMENDATION_EVALUATION_HOLDOUT_ORDER_COUNT:-1}
      RECOMMENDATION_EVALUATION_EXCLUDE_PREVIOUSLY_PURCHASED: ${RECOMMENDATION_EVALUATION_EXCLUDE_PREVIOUSLY_PURCHASED:-true}
      RECOMMENDATION_EVALUATION_RANDOM_SEED: ${RECOMMENDATION_EVALUATION_RANDOM_SEED:-42}
      RECOMMENDATION_EVALUATION_OUTPUT_DIRECTORY: /app/evaluation-reports
      RECOMMENDATION_EVALUATION_MAXIMUM_SUBJECTS: ${RECOMMENDATION_EVALUATION_MAXIMUM_SUBJECTS:-0}
    ports:
      - "8085:8000"
    volumes:
      - recommendation_model_artifacts:/app/artifacts
      - recommendation_evaluation_reports:/app/evaluation-reports

volumes:
  recommendation_model_artifacts:
  recommendation_evaluation_reports:
